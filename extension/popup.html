<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CaesarAI Autofill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #10b981;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .dot-online { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .dot-offline { background: #ef4444; }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card-val {
      font-size: 12px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-fill {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: all 0.2s;
    }
    .btn-fill:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }
    .btn-fill:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
    }
    .kbd {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #334155;
      font-family: monospace;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>⚡</span> CaesarAI
    </div>
    <div id="statusBadge" class="status-badge status-offline">
      <div id="statusDot" class="dot dot-offline"></div>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Target Job Page</div>
    <div id="pageTitle" class="card-val">Detecting active tab...</div>
  </div>

  <button id="btnAutofill" class="btn-fill" disabled>
    <span>⚡</span> Auto-Fill Application (agy)
  </button>

  <div class="footer">
    <span>Zero-regex AI autofill</span>
    <span class="kbd">Alt+Shift+C</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
