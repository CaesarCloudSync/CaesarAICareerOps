services:
  # ==========================================================
  # 🐘 PostgreSQL Database (Amari Provider with Persistent Volume)
  # ==========================================================
  postgres-amari:
    image: postgres:16-alpine
    container_name: caesar-postgres-amari
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caesar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caesar_ops_password}
      POSTGRES_DB: ${POSTGRES_DB:-caesar_ops_amari}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - caesar_amari_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caesar} -d ${POSTGRES_DB:-caesar_ops_amari}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - caesar-network

  # ==========================================================
  # 🧠 CaesarAICareerOps Application (Amari - Port 8002)
  # ==========================================================
  app-amari:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: caesaraicareerops-amari
    restart: always
    ports:
      - "${PORT:-8002}:8002"
    environment:
      - PORT=8002
      - HOST=0.0.0.0
      - ENVIRONMENT=docker
      - DATABASE_URL=postgresql://${POSTGRES_USER:-caesar}:${POSTGRES_PASSWORD:-caesar_ops_password}@postgres-amari:5432/${POSTGRES_DB:-caesar_ops_amari}
      - CAREER_OPS_DIR=/app/backend/career-ops
      - DATA_DIR=/app/data
    volumes:
      - caesar_amari_app_data:/app/data
      - ../backend/application:/app/backend/application
      - ../backend/career-ops:/app/backend/career-ops
      # Mount host agy CLI and OAuth session so container has full AGY access
      - ${HOME:-/home/amari}/.local/bin/agy:/usr/local/bin/agy:ro
      - ${HOME:-/home/amari}/.gemini:/home/appuser/.gemini
      - ${HOME:-/home/amari}/.config:/home/appuser/.config:ro
    depends_on:
      postgres-amari:
        condition: service_healthy
    networks:
      - caesar-network

volumes:
  caesar_amari_postgres_data:
    name: caesar_amari_postgres_data
    external: true
  caesar_amari_app_data:
    name: caesar_amari_app_data
    external: true

networks:
  caesar-network:
    name: caesar-network
    external: true
